version: "3.9"

services:
  postgres:
    image: postgres:17
    env_file:
      - ./backend/.env.${ENV}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_${ENV}_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_${ENV}_data:/data
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT}:5000"
    env_file:
      - ./backend/.env.${ENV}
    depends_on:
      - postgres
      - redis
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${FRONTEND_PORT}:80"
    env_file:
      - ./frontend/.env.${ENV}
    depends_on:
      - backend
    restart: always

volumes:
  postgres_dev_data:
  postgres_staging_data:
  postgres_production_data:
  redis_dev_data:
  redis_staging_data:
  redis_production_data:
